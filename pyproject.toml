[project]
name = "qrpayhub"
version = "0.1.0"
description = "Межбанковская платформа для приёма платежей через QR-коды без комиссий"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn>=0.24.0",
    "sqlalchemy>=2.0.23",
    "pydantic[email]>=2.5.0",
    "pydantic-settings>=2.1.0",
    "qrcode>=7.4.2",
    "pillow>=10.1.0",
    "python-dotenv>=1.0.0",
    "python-jose[cryptography]>=3.3.0",
    "requests>=2.31.0",
    "psutil>=5.9.0",
    "faker>=20.1.0",
    "bcrypt>=4.0.0",
    "PyJWT>=2.8.0",
    "aiohttp>=3.12.15",
    "jinja2>=3.1.6",
    "email-validator>=2.2.0",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 88

[project.scripts]
qrpayhub = "app.main:app"
