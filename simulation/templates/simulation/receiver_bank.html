<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }}</title>
    
    <script>
        // Глобальные переменные для URL
        window.BASE_URL = "{{ BASE_URL }}";
        window.PAYMENT_URL_TEMPLATE = "{{ PAYMENT_URL_TEMPLATE }}";
        window.SIMULATION_URL_TEMPLATE = "{{ SIMULATION_URL_TEMPLATE }}";
        window.BANK_API_URL = "{{ BANK_API_URL }}";
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .bg-gradient-receiver {
            background: linear-gradient(135deg, #a8e6cf 0%, #dcedc8 100%);
        }
        .balance-card {
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            background: linear-gradient(135deg, #4caf50 0%, #81c784 100%);
            color: white;
        }
        .balance-amount {
            font-size: 3em;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        .request-card {
            border-left: 4px solid #ff9800;
            transition: all 0.3s;
            margin-bottom: 10px;
        }
        .request-card:hover {
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .new-request {
            animation: fadeInUp 0.8s ease;
            border-left-color: #ff5722 !important;
            background: linear-gradient(90deg, #fff3e0 0%, #ffffff 100%);
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        .status-online {
            background-color: #4caf50;
            box-shadow: 0 0 0 2px rgba(76, 175, 80, 0.3);
        }
        .merchant-info {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: 10px;
            padding: 20px;
        }
    </style>
</head>
<body class="bg-light" 
      data-merchant-id="{{ merchant.id }}" 
      data-balance="{{ total_balance }}">
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-gradient-receiver text-dark">
        <div class="container">
            <a class="navbar-brand text-dark" href="/simulation">
                <i class="fas fa-chart-line me-2"></i>
                Банк Получателя
            </a>
            <div class="navbar-nav ms-auto">
                <div class="nav-item">
                    <span class="nav-link text-dark">
                        <span class="status-indicator status-online"></span>
                        Онлайн мониторинг
                    </span>
                </div>
                <a class="nav-link text-dark" href="/simulation">
                    <i class="fas fa-arrow-left me-1"></i>
                    Назад к симулятору
                </a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Request Monitor -->
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <div class="row align-items-center">
                            <div class="col">
                                <h5 class="mb-0">
                                    <i class="fas fa-list me-2"></i>
                                    Мониторинг запросов
                                </h5>
                            </div>
                            <div class="col-auto">
                                <button class="btn btn-outline-primary btn-sm" onclick="refreshRequests()">
                                    <i class="fas fa-sync-alt" id="refreshIcon"></i>
                                    Обновить
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="card-body p-0">
                        <div id="requestsList">
                                <div class="text-center py-5">
                                    <i class="fas fa-inbox fa-3x text-muted mb-3"></i>
                                <h5 class="text-muted">Запросов пока нет</h5>
                                <p class="text-muted">Ожидание запросов от QRPayHub...</p>
                                </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Глобальные переменные
        let merchantId = parseInt(document.body.getAttribute('data-merchant-id') || '1');
        let refreshInterval = null;
        let currentBalance = parseFloat(document.body.getAttribute('data-balance') || '10500');
        let pendingRequests = [];

        // Функция обновления информации о банке получателя
        function updateReceiverBankInfo() {
            // Информация о банке уже передается из бэкенда, поэтому просто логируем
            const receiverBankNameElement = document.getElementById('receiverBankName');
            if (receiverBankNameElement) {
                console.log(`Банк получателя: ${receiverBankNameElement.textContent}`);
            }
        }

        // Запуск автообновления при загрузке страницы
        document.addEventListener('DOMContentLoaded', function() {
            updateReceiverBankInfo(); // Обновляем информацию о банке получателя
            startAutoRefresh();
            updateLastUpdate();
        });

        // Функция автоматического обновления
        function startAutoRefresh() {
            refreshInterval = setInterval(async () => {
                await checkForNewRequests();
            }, 2000); // Обновляем каждые 2 секунды
        }

        // Функция проверки новых запросов
        async function checkForNewRequests() {
            try {
                const response = await fetch('/simulation/api/bank-requests/receiver_bank');
                if (response.ok) {
                    const data = await response.json();
                    updateRequestsList(data.requests);
                }
                updateLastUpdate();
            } catch (error) {
                console.error('Ошибка проверки запросов:', error);
            }
        }

        // Функция обновления списка запросов
        function updateRequestsList(requests) {
            const requestsList = document.getElementById('requestsList');
            
            if (requests.length === 0) {
                requestsList.innerHTML = `
                    <div class="text-center py-5">
                        <i class="fas fa-inbox fa-3x text-muted mb-3"></i>
                        <h5 class="text-muted">Запросов пока нет</h5>
                        <p class="text-muted">Ожидание запросов от QRPayHub...</p>
                    </div>
                `;
                return;
            }
            
            requestsList.innerHTML = '';
            
            requests.forEach(request => {
                const requestCard = document.createElement('div');
                requestCard.className = 'request-card p-3 border-bottom';
                requestCard.id = `request-${request.id}`;
                
                const statusClass = request.status === 'pending' ? 'text-warning' : 
                                  request.status === 'accepted' ? 'text-success' : 'text-danger';
                const statusText = request.status === 'pending' ? 'Ожидание' : 
                                 request.status === 'accepted' ? 'Принято' : 'Отклонено';
                
                requestCard.innerHTML = `
                    <div class="row align-items-center">
                        <div class="col-md-4">
                            <div class="fw-bold ${statusClass}">
                                ${request.phase.toUpperCase()} ${request.operation_type === 'refund' ? 'ВОЗВРАТ' : 'запрос'}
                            </div>
                            <small class="text-muted">
                                Сумма: ${request.amount} ${request.currency}
                            </small>
                            ${request.operation_type === 'refund' ? `
                                <br><small class="text-info">Причина: ${request.reason || 'N/A'}</small>
                            ` : ''}
                        </div>
                        <div class="col-md-4">
                            <div class="fw-bold">ID: ${request.transaction_id}</div>
                            <small class="text-muted">${request.bank_role} банк</small>
                            ${request.operation_type === 'refund' ? `
                                <br><small class="text-info">🔄 ВОЗВРАТ</small>
                            ` : ''}
                        </div>
                        <div class="col-md-4 text-end">
                            ${request.status === 'pending' ? `
                                <button class="btn btn-success btn-sm me-2" onclick="acceptRequest('${request.id}', ${request.amount})">
                                    <i class="fas fa-check"></i> Принять
                                </button>
                                <button class="btn btn-danger btn-sm" onclick="rejectRequest('${request.id}')">
                                    <i class="fas fa-times"></i> Отклонить
                                </button>
                            ` : `
                                <span class="badge ${request.status === 'accepted' ? 'bg-success' : 'bg-danger'}">${statusText}</span>
                            `}
                        </div>
                    </div>
                `;
                
                requestsList.appendChild(requestCard);
            });
        }

        // Функция обработки PREPARE запроса
        function handlePrepareRequest(requestId, amount) {
            const requestsList = document.getElementById('requestsList');
            
            const requestCard = document.createElement('div');
            requestCard.className = 'request-card p-3 border-bottom new-request';
            requestCard.innerHTML = `
                <div class="row align-items-center">
                    <div class="col-md-4">
                        <div class="fw-bold text-warning">
                            PREPARE запрос
                        </div>
                        <small class="text-muted">
                            Сумма: ${amount} KGS
                        </small>
                    </div>
                    <div class="col-md-4">
                        <div class="fw-bold">ID: ${requestId}</div>
                        <small class="text-muted">Ожидание решения</small>
                    </div>
                    <div class="col-md-4 text-end">
                        <button class="btn btn-success btn-sm me-2" onclick="acceptRequest('${requestId}', ${amount})">
                            <i class="fas fa-check"></i> Принять
                        </button>
                        <button class="btn btn-danger btn-sm" onclick="rejectRequest('${requestId}')">
                            <i class="fas fa-times"></i> Отклонить
                        </button>
                    </div>
                </div>
            `;
            
            requestsList.insertBefore(requestCard, requestsList.firstChild);
            
            // Убираем выделение через 3 секунды
            setTimeout(() => {
                requestCard.classList.remove('new-request');
            }, 3000);
        }

        // Функция принятия запроса
        async function acceptRequest(requestId, amount) {
            try {
                // Находим запрос в списке, чтобы определить его тип
                const requestElement = document.getElementById(`request-${requestId}`);
                const isRefund = requestElement && requestElement.innerHTML.includes('ВОЗВРАТ');
                
                const response = await fetch(`/simulation/api/bank-requests/receiver_bank/${requestId}/respond`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        status: 'accepted',
                        message: 'Request accepted by receiver bank',
                        confirmed: isRefund  // Добавляем флаг подтверждения только для возвратов
                    })
                });
                
                if (response.ok) {
                    // НЕ уменьшаем баланс здесь - только при финальном подтверждении
                    showNotification(`Запрос ${requestId} принят. Ожидание финального подтверждения.`, 'success');
                    // Обновляем список запросов
                    await checkForNewRequests();
                }
            } catch (error) {
                console.error('Ошибка принятия запроса:', error);
                showNotification(`Ошибка принятия запроса: ${error.message}`, 'danger');
            }
        }

        // Функция отклонения запроса
        async function rejectRequest(requestId) {
            try {
                const response = await fetch(`/simulation/api/bank-requests/receiver_bank/${requestId}/respond`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        status: 'rejected',
                        message: 'Request rejected by receiver bank'
                    })
                });
                
                if (response.ok) {
                    showNotification(`Запрос ${requestId} отклонен`, 'danger');
                    // Обновляем список запросов
                    await checkForNewRequests();
                }
            } catch (error) {
                console.error('Ошибка отклонения запроса:', error);
                showNotification(`Ошибка отклонения запроса: ${error.message}`, 'danger');
            }
        }

        // Функция обновления отображения баланса
        function updateBalanceDisplay() {
            const balanceElement = document.getElementById('balanceAmount');
            
            // Анимация обновления
            balanceElement.style.transform = 'scale(1.1)';
            balanceElement.style.color = '#ff9800';
            
            setTimeout(() => {
                balanceElement.textContent = currentBalance;
                balanceElement.style.transform = 'scale(1)';
                balanceElement.style.color = 'white';
            }, 300);
        }

        // Функция финального списания баланса (вызывается при подтверждении платежа)
        function finalizeBalanceDeduction(amount) {
            currentBalance -= amount;
            updateBalanceDisplay();
            showNotification(`Баланс списан: ${amount} KGS`, 'success');
        }

        // Экспортируем функцию для использования из других страниц
        window.finalizeBalanceDeduction = finalizeBalanceDeduction;

        // Функция обновления времени последнего обновления
        function updateLastUpdate() {
            const lastUpdateElement = document.getElementById('lastUpdate');
            if (lastUpdateElement) {
                lastUpdateElement.textContent = new Date().toLocaleTimeString();
            }
        }

        // Функция показа уведомлений
        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = `alert alert-${type} alert-dismissible position-fixed`;
            notification.style.cssText = 'top: 20px; right: 20px; z-index: 9999; max-width: 300px;';
            notification.innerHTML = `
                <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'danger' ? 'times-circle' : 'info-circle'} me-2"></i>
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                if (notification.parentNode) {
                    notification.remove();
                }
            }, 5000);
        }

        // Остановка автообновления при уходе со страницы
        window.addEventListener('beforeunload', () => {
            if (refreshInterval) {
                clearInterval(refreshInterval);
            }
        });

        // Функция ручного обновления
        window.refreshRequests = function() {
            checkForNewRequests();
        };

        // Экспортируем функции для использования в других скриптах
        window.handlePrepareRequest = handlePrepareRequest;
        window.acceptRequest = acceptRequest;
        window.rejectRequest = rejectRequest;
    </script>
</body>
</html>
